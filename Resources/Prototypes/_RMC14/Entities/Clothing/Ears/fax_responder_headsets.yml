#headsets...
# UNMC + Provost (they are similar enough and share every other means of listening to the round, so I figure why not this)
- type: entity
  parent: RMCHeadsetShip
  id: CMHeadsetUNMCFaxResponder
  name: UNMC high command headset
  description: Issued only to high command staff.
  components:
  - type: Sprite
    state: mco_headset
  - type: ContainerFill
    containers:
      key_slots:
      - RMCEncryptionKeyUNMCFaxResponder
  - type: HeadsetMultiBroadcast
    cooldown: 60
  - type: RMCHeadset
    radioTextIncrease: 3
    channels:
    - MarineSOF
  - type: GrantSquadLeaderTracker
    defaultMode: ProvostMarshal
    trackerModes:
    - ProvostMarshal
    - ProvostDeputyMarshal
    - ProvostChiefInspector
    - ProvostInspector


# Mostly Read-only keys for fax responders and the like.
# UNMC + Provost Key
- type: entity
  parent: CMEncryptionKey
  id: RMCEncryptionKeyUNMCFaxResponder
  name: unmc read only master encryption key
  components:
  - type: EncryptionKey
    channels:
    - MarineHighCommand
    - Provost
    readOnlyChannels:
    - MarineCommand
    - MarineCommon
    - MarineMilitaryPolice
    - MarineAlpha
    - MarineBravo
    - MarineCharlie
    - MarineDelta
    - MarineEcho
    - MarineFoxtrot
    - MarineEngineer
    - MarineMedical
    - MarineRequisition
    - MarineJTAC
    - MarineIntel
    - MarineSOF
  - type: Sprite
    state: cmp_key

